[project]
name = "orbit-project-workspace"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build && node scripts/sync-public.mjs"
